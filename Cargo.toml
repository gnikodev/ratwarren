[package]
name = "ratwarren"
version = "0.1.0"
edition = "2024"
description = "A terminal UI client for SQL databases"
license = "MIT"
publish = false

[dependencies]
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
toml = "1"
directories = "6"
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-postgres = "=0.7.18"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1"
# Exact pin: split.rs's statement splitting depends on Span::end being
# EXCLUSIVE, verified empirically against this exact version (a probe binary
# tokenizing "SELECT" gives span (1,1)..(1,7)). The crate's own doc comment on
# Span::end says "inclusive", which is wrong — that's an unwritten contract we
# can't rely on surviving a future upgrade without re-verifying.
sqlparser = { version = "=0.62.0", default-features = false, features = ["std"] }
# Default features are load-bearing: `default = ["v1"]` selects the
# per-platform native store (Keychain / Credential Manager / Secret Service);
# `default-features = false` trips the crate's own compile_error!. Verified
# against 4.1.6: Entry::new(service, account) -> Result<Entry>, get_password()
# -> Result<String>, Error::NoEntry when the item is absent.
keyring = "4"

[dev-dependencies]
tempfile = "3"
# Cargo unifies features for a crate shared between normal and dev
# dependencies, so this only adds `pause`/`advance` to test builds -- the
# production `tokio` dependency above is unaffected.
tokio = { version = "1.53", features = ["test-util"] }
